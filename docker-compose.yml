version: '3.8'

services:
  sabipass-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sabipass-ai
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TIER_FREE_MODEL=${TIER_FREE_MODEL:-groq/llama-3.1-8b-instant}
      - TIER_PREMIUM_MODEL=${TIER_PREMIUM_MODEL:-groq/llama-3.3-70b-versatile}
      - EFFICIENCY_MODE_MODEL=${EFFICIENCY_MODE_MODEL:-groq/llama-3.1-8b-instant}
      - TIER_FREE_MAX_HISTORY_TURNS=${TIER_FREE_MAX_HISTORY_TURNS:-1}
      - TIER_PREMIUM_MAX_HISTORY_TURNS=${TIER_PREMIUM_MAX_HISTORY_TURNS:-3}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      - SABI_DEMO_MODE=${SABI_DEMO_MODE:-true}
      - SABI_BOOTSTRAP_MOCK_DATA=${SABI_BOOTSTRAP_MOCK_DATA:-true}
      - SYMPY_TIMEOUT_MS=${SYMPY_TIMEOUT_MS:-250}
      - SYMPY_MAX_WORKERS=${SYMPY_MAX_WORKERS:-1}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-2.5}
      - LLM_QUEUE_TIMEOUT_SECONDS=${LLM_QUEUE_TIMEOUT_SECONDS:-0.05}
      - LLM_MAX_CONCURRENT_REQUESTS=${LLM_MAX_CONCURRENT_REQUESTS:-4}
      - LLM_RETRY_ATTEMPTS=${LLM_RETRY_ATTEMPTS:-1}
      - LLM_RETRY_MIN_SECONDS=${LLM_RETRY_MIN_SECONDS:-0.05}
      - LLM_RETRY_MAX_SECONDS=${LLM_RETRY_MAX_SECONDS:-0.2}
      - LLM_CIRCUIT_FAILURE_THRESHOLD=${LLM_CIRCUIT_FAILURE_THRESHOLD:-5}
      - LLM_CIRCUIT_RESET_SECONDS=${LLM_CIRCUIT_RESET_SECONDS:-20.0}
      - REQUEST_ADMISSION_MAX_CONCURRENT=${REQUEST_ADMISSION_MAX_CONCURRENT:-24}
      - REQUEST_ADMISSION_QUEUE_TIMEOUT_SECONDS=${REQUEST_ADMISSION_QUEUE_TIMEOUT_SECONDS:-0.01}
      - OBSERVABILITY_TRACE_BUFFER_SIZE=${OBSERVABILITY_TRACE_BUFFER_SIZE:-1000}
      - OBSERVABILITY_TRACE_FLUSH_ENABLED=${OBSERVABILITY_TRACE_FLUSH_ENABLED:-true}
      - OBSERVABILITY_TRACE_FLUSH_INTERVAL_SECONDS=${OBSERVABILITY_TRACE_FLUSH_INTERVAL_SECONDS:-1.0}
      - OBSERVABILITY_TRACE_FLUSH_BATCH_SIZE=${OBSERVABILITY_TRACE_FLUSH_BATCH_SIZE:-100}
      - OBSERVABILITY_TRACE_LOG_PATH=${OBSERVABILITY_TRACE_LOG_PATH:-logs/sabipass_traces.jsonl}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
